name: Build Modo Manager Dev APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modo-manager-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build Modo Manager Dev
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Test and build Dev APK
        env:
          _JAVA_OPTIONS: -Djava.awt.headless=true
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Verify Dev APK signature and 16 KiB alignment
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK"
          test -d "$SDK/build-tools"

          APKSIGNER=$(find "$SDK/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)
          ZIPALIGN=$(find "$SDK/build-tools" -maxdepth 2 -type f -name zipalign | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          test -n "$ZIPALIGN"

          APK=$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)
          test -n "$APK"

          "$APKSIGNER" verify --verbose "$APK"
          "$ZIPALIGN" -c -P 16 4 "$APK"

          echo "PASS: Dev APK signature and 16 KiB alignment"

      - name: Collect Dev APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          APK=$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)
          test -n "$APK"
          cp "$APK" dist/Modo-Manager-Dev.apk

      - name: Upload Dev APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: Modo-Manager-Dev-apk
          path: dist/Modo-Manager-Dev.apk
          if-no-files-found: error
          retention-days: 1
