name: Build Modo Manager APK

on:
  workflow_dispatch:

concurrency:
  group: modo-manager-manual-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  build-debug-apk:
    name: Build optimized installable APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Setup persistent debug signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64" || {
            echo "::error::KEYSTORE_B64 is not configured. Refusing to create an APK with an ephemeral signing identity."
            exit 1
          }
          printf '%s' "$KEYSTORE_B64" | base64 -d > app/keystore.jks
          test -s app/keystore.jks

      - name: Test and build optimized APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          _JAVA_OPTIONS: -Djava.awt.headless=true
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ENTRY_ALIAS: ${{ secrets.KEYSTORE_ENTRY_ALIAS }}
          KEYSTORE_ENTRY_PASSWORD: ${{ secrets.KEYSTORE_ENTRY_PASSWORD }}
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease -PnoProguard=false --stacktrace

      - name: Verify APK signing and 16 KiB alignment
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ENTRY_ALIAS: ${{ secrets.KEYSTORE_ENTRY_ALIAS }}
          KEYSTORE_ENTRY_PASSWORD: ${{ secrets.KEYSTORE_ENTRY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          for name in KEYSTORE_PASSWORD KEYSTORE_ENTRY_ALIAS KEYSTORE_ENTRY_PASSWORD; do
            test -n "${!name:-}" || {
              echo "::error::Missing signing credential: $name"
              exit 1
            }
          done

          test -s app/keystore.jks
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK"
          test -d "$SDK/build-tools"

          APKSIGNER=$(find "$SDK/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)
          ZIPALIGN=$(find "$SDK/build-tools" -maxdepth 2 -type f -name zipalign | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          test -n "$ZIPALIGN"

          APK=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)
          test -n "$APK"

          "$APKSIGNER" verify --verbose "$APK"

          CERT_LINES=$("$APKSIGNER" verify --print-certs "$APK")
          ACTUAL_CERT=$(printf '%s\n' "$CERT_LINES" |
            sed -nE 's/^(Signer #[0-9]+|V[0-9]+(\.[0-9]+)? Signer:?) certificate SHA-256 digest: ([[:xdigit:]]{64})$/\3/p' |
            tr '[:upper:]' '[:lower:]' | sort -u)

          EXPECTED_CERT=$(keytool -exportcert \
            -keystore app/keystore.jks \
            -storepass:env KEYSTORE_PASSWORD \
            -alias "$KEYSTORE_ENTRY_ALIAS" |
            openssl dgst -sha256 -binary |
            od -An -v -tx1 | tr -d '[:space:]')

          if [[ ! "$ACTUAL_CERT" =~ ^[0-9a-f]{64}$ ||
                ! "$EXPECTED_CERT" =~ ^[0-9a-f]{64}$ ||
                "$ACTUAL_CERT" != "$EXPECTED_CERT" ]]; then
            echo "::error::APK certificate does not match configured keystore"
            exit 1
          fi

          echo "PASS: APK signature and certificate"

          if ! "$ZIPALIGN" -c -P 16 4 "$APK"; then
            echo "::error::APK failed 16 KiB alignment verification"
            exit 1
          fi

          echo "PASS: APK alignment 16 KiB"

      - name: Collect APK
        run: |
          mkdir -p dist
          APK=$(find app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" dist/Modo-Manager.apk
          ls -lh dist/Modo-Manager.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: Modo-Manager-apk
          path: dist/Modo-Manager.apk
          if-no-files-found: error
          retention-days: 1
