name: Build Modo Manager APK

on:
  workflow_dispatch:

concurrency:
  group: modo-manager-manual-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  build-debug-apk:
    name: Build optimized installable APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Setup persistent debug signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64" || {
            echo "::error::KEYSTORE_B64 is not configured. Refusing to create an APK with an ephemeral signing identity."
            exit 1
          }
          printf '%s' "$KEYSTORE_B64" | base64 -d > app/keystore.jks
          test -s app/keystore.jks

      - name: Test and build optimized APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          _JAVA_OPTIONS: -Djava.awt.headless=true
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ENTRY_ALIAS: ${{ secrets.KEYSTORE_ENTRY_ALIAS }}
          KEYSTORE_ENTRY_PASSWORD: ${{ secrets.KEYSTORE_ENTRY_PASSWORD }}
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease -PnoProguard=false --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          APK=$(find app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" dist/Modo-Manager.apk
          ls -lh dist/Modo-Manager.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: Modo-Manager-apk
          path: dist/Modo-Manager.apk
          if-no-files-found: error
          retention-days: 1
