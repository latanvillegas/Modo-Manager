name: Build Modo Manager APK

on:
  workflow_dispatch:

concurrency:
  group: modo-manager-manual-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  build-debug-apk:
    name: Build installable debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          _JAVA_OPTIONS: -Djava.awt.headless=true
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          APK=$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" dist/Modo-Manager-debug.apk
          ls -lh dist/Modo-Manager-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: Modo-Manager-debug-apk
          path: dist/Modo-Manager-debug.apk
          if-no-files-found: error
          retention-days: 14
